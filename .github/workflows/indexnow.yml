# Announce every page, every time the site changes.
#
# Asking a console to index one page by hand does not scale past a handful,
# and it is the only part of this nobody can automate. IndexNow is the part
# that can: the whole list in one request, and every participating engine is
# notified at once — Bing above all, because ChatGPT's search runs on it.
#
# The key is a public file and proves only that whoever submits these urls
# controls the site. It lives at /agentfeed/<key>.txt rather than at the host
# root, because the host root belongs to a GitHub user page we do not own a
# repository for — so keyLocation has to name the real path. Getting that
# wrong is a 403 and no announcement at all, which is exactly what happened
# here for three days.
name: Announce to search engines

on:
  push:
    branches: [main]
    paths: ['sitemap.xml', '**/index.html', 'api/stores.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The site has to be serving the new pages before an engine is told to
      # fetch them, and Pages deploys from the same push.
      - name: Let the deployment land
        run: sleep 90

      - name: Check the key file is actually reachable
        run: |
          KEY=6207428dda82556a2a0a28d0e53ee533
          LOC="https://nitairevivo.github.io/agentfeed/$KEY.txt"
          CODE=$(curl -sS -o /tmp/key.txt -w "%{http_code}" "$LOC")
          echo "key file: $LOC -> $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::the key file is not served; IndexNow will refuse every submission"
            exit 1
          fi
          if [ "$(cat /tmp/key.txt)" != "$KEY" ]; then
            echo "::error::the key file does not contain the key"
            exit 1
          fi

      - name: Submit every url
        run: python3 tools/indexnow_submit.py sitemap.xml

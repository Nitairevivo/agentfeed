# Is the whole thing up, from outside?
#
# Everything else checks files. This opens the site the way a reader opens it
# and the endpoints the way an assistant hits them — which the private
# repository cannot do, because its environment has no outbound network. A
# build that passes its own audit and a site that answers a request are
# different facts.
name: Is it up

on:
  workflow_dispatch:
  schedule:
    # Daily. Anything that breaks a published address breaks it for everything
    # reading us, and a day is already a long time to find that out.
    - cron: "0 7 * * *"

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Open the site and the endpoints
        run: python3 -u tools/health.py

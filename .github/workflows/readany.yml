# Any site, every door — and it says which one opened.
#
# The four readers here each knew one thing, so a site that was none of them
# got the answer "not readable", which was never true: it only ever meant that
# none of the four doors we knew how to open was the right one.
#
# This tries them all, cheapest first, and reports what it found and what to do
# with it. It reads only. Nothing is written to any site, no contact details
# are collected, and nothing is published — a business still consents first.
name: Read any site

on:
  workflow_dispatch:
    inputs:
      hosts:
        description: 'Domains — comma, space or newline separated'
        required: true

permissions:
  contents: read

jobs:
  readany:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Try every door
        env:
          READANY_HOSTS: ${{ inputs.hosts }}
        run: python3 -u tools/readany.py

# Many shops' catalogues in one run.
#
# The single-shop version needs one dispatch per shop, which was right while
# shops arrived one a week. A partner has just started forwarding his client
# list, and forty dispatches is forty chances to lose track of which shop was
# read and which was not.
#
# Same reader as read-a-storefront.yml, in a loop, with one line of outcome per
# shop and a summary at the end. A shop that fails does not stop the others —
# it is reported and the run carries on, because "nineteen read, one refused"
# is a useful answer and "the run died on the fourth" is not.
#
# Reads public catalogue endpoints only. No contact details, nothing written to
# any shop, nothing published: the private repository converts and publishes,
# and only for a business that has consented.
name: Read many storefronts

on:
  workflow_dispatch:
    inputs:
      shops:
        description: 'One per line or comma-separated, as domain:platform —
          e.g. "dogift.co.il:woo, shilav.co.il:shopify". Platform may be
          omitted and both will be tried.'
        required: true

permissions:
  contents: write

concurrency:
  group: read-many-storefronts
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Read every catalogue
        env:
          SHOPS: ${{ inputs.shops }}
        run: |
          set -uo pipefail
          mkdir -p tools/feeds
          summary=""
          ok=0; bad=0

          read_one () {
            host="$1"; platform="$2"
            base="https://${host}"
            out="tools/feeds/${host}.json"
            tmp=$(mktemp -d)
            pages=0
            for page in $(seq 1 40); do
              if [ "$platform" = "woo" ]; then
                url="${base}/wp-json/wc/store/products?per_page=100&page=${page}"
              else
                url="${base}/products.json?limit=250&page=${page}"
              fi
              code=$(curl -sS -w '%{http_code}' -o "$tmp/p${page}.json" \
                       -H 'User-Agent: AgentFeed/0.1 (+https://nitairevivo.github.io/agentfeed)' \
                       --max-time 60 "$url" || echo 000)
              [ "$code" = "200" ] || break
              if [ "$platform" = "woo" ]; then
                n=$(jq 'if type=="array" then length else 0 end' "$tmp/p${page}.json" 2>/dev/null || echo 0)
              else
                n=$(jq '.products | length' "$tmp/p${page}.json" 2>/dev/null || echo 0)
              fi
              [ "${n:-0}" -gt 0 ] || break
              pages=$page
              sleep 1
            done
            [ "$pages" -gt 0 ] || { rm -rf "$tmp"; return 1; }
            if [ "$platform" = "woo" ]; then
              jq -s --arg host "$host" --arg platform "$platform" \
                    --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                '{host:$host, platform:$platform, read_at:$at, products:(add // [])}' \
                "$tmp"/p*.json > "$out"
            else
              jq -s --arg host "$host" --arg platform "$platform" \
                    --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                '{host:$host, platform:$platform, read_at:$at,
                  products:([.[].products] | add // [])}' \
                "$tmp"/p*.json > "$out"
            fi
            rm -rf "$tmp"
            return 0
          }

          # Newlines and commas both separate, because a list pasted from a
          # message arrives in whichever shape the person had it.
          entries=$(printf '%s' "$SHOPS" | tr ',\n' '\n\n')
          while IFS= read -r raw; do
            entry=$(printf '%s' "$raw" | xargs)
            [ -n "$entry" ] || continue
            host="${entry%%:*}"
            platform="${entry#*:}"
            [ "$platform" != "$entry" ] || platform=""
            host="${host#https://}"; host="${host#http://}"; host="${host%%/*}"
            [ -n "$host" ] || continue

            done_one=0
            # An unstated platform is tried both ways rather than guessed. A
            # guess written into a feed file is a guess every later run treats
            # as a fact.
            for p in ${platform:-woo shopify}; do
              if read_one "$host" "$p"; then
                n=$(jq '.products | length' "tools/feeds/${host}.json")
                echo "  ✓ ${host}: ${p}, ${n} products"
                summary="${summary}\n| ${host} | ${p} | ${n} |"
                ok=$((ok+1)); done_one=1; break
              fi
            done
            if [ "$done_one" -eq 0 ]; then
              echo "  ✗ ${host}: no readable catalogue today — this is 'not read', not 'has none'"
              summary="${summary}\n| ${host} | — | not read |"
              bad=$((bad+1))
            fi
          done <<< "$entries"

          echo ""
          echo "${ok} read, ${bad} not read"
          {
            echo "## Catalogues read"
            echo ""
            echo "| shop | platform | products |"
            echo "|---|---|---|"
            printf '%b\n' "$summary"
            echo ""
            echo "**${ok} read, ${bad} not read.** A shop that was not read is a"
            echo "shop we could not reach today, not a shop without a catalogue."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep them
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/feeds
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "read many storefronts — $(date -u +%Y-%m-%d\ %H:%M) UTC"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase --quiet origin main || true
            sleep $((attempt * 3))
          done
          exit 1

# Who links back to us — the measurement the private repository cannot take.
#
# Its environment has no outbound network, so the report there has said
# "0 of 10" since 10 September and nothing has been able to refresh it. Here
# the network is open and the minutes are free, because this repository is
# public.
#
# It reads api/stores.json from this repository and asks each business's own
# site whether it carries a link to its page here. It reads nothing else,
# writes nothing to the site, and needs no secrets.
name: Who links back to us

on:
  workflow_dispatch:
  schedule:
    # Weekly. A footer link does not appear twice a day, and a check that runs
    # more often than the thing it measures is noise with a timestamp on it.
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  backlinks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ask each business's site whether it links back
        run: python3 -u tools/backlinks.py
      - uses: actions/upload-artifact@v4
        with:
          name: backlinks-report
          path: backlinks-report.md
          if-no-files-found: ignore

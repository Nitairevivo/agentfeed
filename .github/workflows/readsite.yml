# Read a site the way a person's browser reads it.
#
# Plain HTTP fetching is enough for a server-rendered site and useless for a
# modern one: djrent.co.il returned the same empty shell for all twenty of its
# pages, because the content is built by JavaScript after the page loads. A
# crawler that does not run JavaScript sees a meta description and nothing
# else — which is exactly the gap this project exists to close.
#
# So this runs a real browser. It renders each page, waits for the content to
# settle, opens whatever is collapsed, and saves the text a visitor sees.
#
# Many sites in one run. Installing Chromium is most of the cost and it is
# identical every time, so reading fifteen businesses one dispatch at a time
# pays that cost fifteen times for nothing.
#
# Only for businesses that have given consent. Same host, capped, polite
# delay, and the owner's own back office is skipped rather than crawled.
# Output goes to the `scratch` branch: Pages serves main, and captured page
# text is not part of the site.
name: Read a site

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Sites to read — one, or many separated by comma, space or newline'
        required: true
      pages:
        description: 'How many pages at most, per site'
        required: false
        default: '40'

permissions:
  contents: write

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install a browser
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Render every page and save what a visitor sees
        env:
          TARGET: ${{ inputs.url }}
          MAXPAGES: ${{ inputs.pages }}
        run: |
          mkdir -p out
          python3 - <<'PY'
          import json as _j
          import os
          import re
          import time
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          from playwright.sync_api import sync_playwright

          targets = [t.strip() for t in
                     re.split(r"[,\s]+", os.environ["TARGET"]) if t.strip()]
          targets = [t if t.startswith("http") else "https://" + t
                     for t in targets]
          cap = int(os.environ.get("MAXPAGES") or 40)

          # The owner's own back office is not ours to walk through, and a
          # file is not a page.
          SKIP = re.compile(r"/(admin|wp-admin|login|cart|checkout|account)(/|$)", re.I)
          FILE = re.compile(r"\.(jpg|jpeg|png|gif|svg|webp|pdf|zip|mp4|mp3|css|js|ico)$", re.I)


          def read_page(page, url):
              """Render one page and return what a visitor would see."""
              page.goto(url, wait_until="networkidle", timeout=30000)
              # A single-page app often paints after the network goes quiet.
              page.wait_for_timeout(1200)
              # An FAQ is the most valuable page on a site like this and the
              # least visible: its answers sit collapsed until someone clicks.
              try:
                  page.eval_on_selector_all(
                      "details", "els => els.forEach(e => e.open = true)")
                  for sel in ('[aria-expanded="false"]', "summary",
                              "[data-state='closed']"):
                      for el in page.query_selector_all(sel)[:60]:
                          try:
                              el.click(timeout=1200)
                          except Exception:
                              pass
                  page.wait_for_timeout(900)
              except Exception:
                  pass
              text = page.inner_text("body")
              text = re.sub(r"[ \t\xa0]+", " ", text)
              text = re.sub(r"\n{3,}", "\n\n", text).strip()
              # The images a business chose for itself are what make a page
              # read as the business rather than as a database entry.
              # Referenced, never copied: if the owner takes one down it goes
              # from our page too.
              og = ""
              if page.query_selector('meta[property="og:image"]'):
                  og = page.eval_on_selector(
                      'meta[property="og:image"]', "e => e.content") or ""
              logo = page.eval_on_selector_all(
                  'header img, nav img, img[alt*="logo" i], img[class*="logo" i]',
                  "els => els.map(e => e.src).filter(Boolean).slice(0,3)")
              shots = page.eval_on_selector_all(
                  "main img, article img, section img",
                  "els => els.map(e => ({s: e.src, a: e.alt, "
                  "w: e.naturalWidth, h: e.naturalHeight}))"
                  ".filter(x => x.s && x.w >= 200 && x.h >= 150).slice(0,6)")
              hrefs = page.eval_on_selector_all(
                  "a[href]", "els => els.map(e => e.href)")
              return text, page.title(), hrefs, {"og": og, "logo": logo,
                                                 "images": shots}


          def read_site(page, base):
              host = urlparse(base).netloc
              seen, queue, pages = set(), [base], []
              while queue and len(pages) < cap:
                  url = queue.pop(0)
                  if url in seen or SKIP.search(url) or FILE.search(url):
                      continue
                  seen.add(url)
                  try:
                      text, title, hrefs, media = read_page(page, url)
                  except Exception as e:
                      print(f"  ! {url}: {str(e)[:70]}")
                      continue
                  if len(text) < 60:
                      print(f"  - {url}: empty after render")
                      continue
                  pages.append((url, title, text[:20000], media))
                  print(f"  ok {url} ({len(text)} chars)")
                  for h in hrefs:
                      h = urljoin(url, h).split("#")[0].rstrip("/")
                      if urlparse(h).netloc == host and h not in seen:
                          queue.append(h)
                  time.sleep(0.6)
              if not pages:
                  print(f"  nothing readable at {host}")
                  return None
              body = "".join(
                  f"\n\n## {u}\n### {t}\n"
                  f"<!--media {_j.dumps(m, ensure_ascii=False)} -->\n\n{x}"
                  for u, t, x, m in pages)
              Path(f"out/{host}.md").write_text(
                  f"# {host}\n\n{len(pages)} עמודים, כפי שדפדפן מציג אותם.\n"
                  "נכתב כדי שאפשר יהיה לחבר מזה רישום מדויק — "
                  "לא כדי להמציא ממנו מחירים.\n" + body + "\n",
                  encoding="utf-8")
              print(f"  wrote out/{host}.md — {len(pages)} pages")
              return host


          written = []
          with sync_playwright() as pw:
              browser = pw.chromium.launch()
              ctx = browser.new_context(
                  locale="he-IL",
                  user_agent="Mozilla/5.0 (compatible; AgentFeed/1.0; "
                             "+https://nitairevivo.github.io/agentfeed/)")
              page = ctx.new_page()
              for base in targets:
                  print(f"\n=== {base} ===")
                  try:
                      host = read_site(page, base)
                  except Exception as e:
                      # One unreachable site must not cost us the other
                      # fourteen, which is the whole reason to batch.
                      print(f"  ! {base} failed entirely: {str(e)[:90]}")
                      continue
                  if host:
                      written.append(host)
              browser.close()

          print(f"\n{len(written)} of {len(targets)} sites read: "
                + ", ".join(written))
          PY

      - name: Commit to the scratch branch
        run: |
          git config user.name  "agentfeed-reader"
          git config user.email "actions@github.com"
          git fetch origin scratch --depth=1 2>/dev/null || true
          git checkout -B scratch
          git rm -r --cached . -q
          mkdir -p read && mv out/* read/ 2>/dev/null || true
          git add -f read
          git commit -q -m "read: ${{ inputs.url }} (rendered)" || echo "nothing to commit"
          git push -f origin scratch
